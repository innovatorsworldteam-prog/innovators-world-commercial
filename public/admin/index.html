<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Innovators World — Admin</title>
<style>:root{--n:#071b3a;--g:#d6aa4a;--bg:#f5f6f8;--t:#172033;--m:#667085;--l:#dfe3ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.top{background:var(--n);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.top strong{letter-spacing:.05em}.wrap{max-width:1180px;margin:32px auto;padding:0 18px}.gate,.panel{background:#fff;border:1px solid var(--l);border-radius:16px;padding:24px;box-shadow:0 8px 28px #071b3a12}.gate{max-width:480px;margin:80px auto}.gate h1{margin-top:0}.row{display:flex;gap:10px}.row>*{flex:1}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid var(--l)}button{background:var(--n);color:#fff;border:0;cursor:pointer;font-weight:700}button.alt{background:#eef1f5;color:var(--n)}.err{color:#b42318;margin-top:12px}.hidden{display:none}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:20px}.num{font-size:30px;font-weight:800}.muted{color:var(--m)}pre{white-space:pre-wrap;background:#0b1730;color:#dbe7ff;padding:16px;border-radius:10px;overflow:auto}@media(max-width:700px){.cards{grid-template-columns:1fr}.row{flex-direction:column}}</style>
</head><body><header class="top"><strong>INNOVATORS WORLD · ADMIN</strong><button id="logout" class="alt hidden">Sign out</button></header>
<main class="wrap"><section id="gate" class="gate"><h1>Admin Control Panel</h1><p class="muted">Restricted operational interface. Credentials are not stored in this page.</p><div class="row"><input id="token" type="password" autocomplete="current-password" placeholder="Admin access token"><button id="login">Enter</button></div><div id="err" class="err"></div></section>
<section id="panel" class="panel hidden"><h1>Operations</h1><p class="muted">Live backend status and administrative controls.</p><div class="cards"><div class="card"><div class="muted">Database</div><div id="db" class="num">—</div></div><div class="card"><div class="muted">Email</div><div id="email" class="num">—</div></div><div class="card"><div class="muted">Service</div><div id="service" class="num">—</div></div></div><button id="refresh">Refresh health</button><h2>Backend response</h2><pre id="output">Loading…</pre></section></main>
<script>const key='iw_admin_token';const gate=document.querySelector('#gate'),panel=document.querySelector('#panel'),token=document.querySelector('#token'),err=document.querySelector('#err'),logout=document.querySelector('#logout');function show(){gate.classList.add('hidden');panel.classList.remove('hidden');logout.classList.remove('hidden');load()}function signout(){sessionStorage.removeItem(key);location.reload()}async function load(){const t=sessionStorage.getItem(key)||'';try{const r=await fetch('/api/health',{headers:{'X-Admin-Token':t}});const d=await r.json();if(!r.ok||d.admin!==true)throw Error(d.error||'Admin authorization failed');document.querySelector('#db').textContent=d.database?'OK':'FAIL';document.querySelector('#email').textContent=d.email_configured?'OK':'NOT SET';document.querySelector('#service').textContent=d.status==='ok'?'ONLINE':'DEGRADED';document.querySelector('#output').textContent=JSON.stringify(d,null,2)}catch(e){sessionStorage.removeItem(key);gate.classList.remove('hidden');panel.classList.add('hidden');logout.classList.add('hidden');err.textContent=e.message||'Access denied'}}document.querySelector('#login').onclick=()=>{if(!token.value.trim()){err.textContent='Admin access token is required.';return}sessionStorage.setItem(key,token.value.trim());err.textContent='';show()};document.querySelector('#refresh').onclick=load;logout.onclick=signout;if(sessionStorage.getItem(key))show();</script></body></html>
