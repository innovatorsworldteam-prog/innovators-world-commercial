<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IWDA — Innovators World</title><link rel="icon" href="/assets/innovators-world-symbol.png"><style>:root{--n:#071b3a;--n2:#0d2a55;--g:#d6aa4a;--gl:#f0d58a;--c:#f7f5ef;--t:#172033;--m:#667085;--b:rgba(7,27,58,.12);--s:0 20px 60px rgba(7,27,58,.12)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--t);background:var(--c);line-height:1.6}.top{background:var(--n);padding:14px 20px}.topin,.wrap{width:min(900px,calc(100% - 28px));margin:auto}.topin{display:flex;justify-content:space-between;align-items:center;gap:16px}.top img{width:135px;background:#fff;padding:6px;border-radius:6px}.back{color:#fff;font-weight:750}.panel{background:#fff;border:1px solid var(--b);border-radius:24px;box-shadow:var(--s);padding:clamp(22px,5vw,48px)}.wrap{margin-top:34px;margin-bottom:70px}.ey{color:var(--g);font-size:.78rem;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.intro h1{color:var(--n);font-size:clamp(2.5rem,7vw,4.6rem);line-height:1.05;margin:12px 0 18px}.intro p{max-width:680px;color:var(--m);font-size:1.08rem}.btn{min-height:50px;padding:0 24px;border-radius:999px;font:inherit;font-weight:850;cursor:pointer;border:1px solid var(--b)}.primary{background:var(--g);color:var(--n);border-color:var(--g)}.secondary{background:#fff;color:var(--n)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.hidden{display:none!important}.progress{height:9px;background:#e8eaee;border-radius:99px;overflow:hidden;margin:12px 0 30px}.progress div{height:100%;background:var(--g)}.qnum{color:var(--g);font-weight:850;font-size:.84rem;letter-spacing:.08em;text-transform:uppercase}.question h2{color:var(--n);font-size:clamp(1.55rem,4vw,2.25rem);line-height:1.25;margin:12px 0 26px}.options{display:grid;gap:12px}.option{width:100%;display:flex;align-items:flex-start;gap:14px;text-align:left;padding:17px;background:#fff;border:1px solid var(--b);border-radius:16px;font:inherit;cursor:pointer}.option:hover,.option:focus-visible{border-color:var(--g);outline:3px solid rgba(214,170,74,.18)}.option.selected{background:#fff9e9;border-color:var(--g)}.letter{min-width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--c);color:var(--n);font-weight:900}.selected .letter{background:var(--g)}.status{min-height:28px;margin:20px 0;color:var(--m);font-size:.92rem}.nav{display:flex;justify-content:space-between;gap:12px}.error{padding:16px;border-radius:14px;background:#fff0f0;color:#8a1c1c;border:1px solid #efb4b4;margin-top:18px}.resultHero{background:linear-gradient(135deg,var(--n),var(--n2));color:#fff;border-radius:20px;padding:30px;margin:20px 0}.score{font-size:clamp(3.4rem,10vw,5.6rem);line-height:1;font-weight:900;color:var(--gl)}.level{font-size:1.2rem;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:18px;border:1px solid var(--b);border-radius:16px}.metric strong{display:block;font-size:1.5rem;color:var(--n)}.metric small{color:var(--m)}.traits{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}.trait{padding:8px 12px;border-radius:999px;background:var(--c);font-weight:750}.note{color:var(--m);font-size:.94rem;margin-top:24px}.premium{margin-top:30px;padding:26px;border-radius:20px;background:linear-gradient(135deg,#fff9e9,#fff);border:1px solid rgba(214,170,74,.45)}.premium h2{color:var(--n);margin:8px 0}.price{font-size:2rem;font-weight:900;color:var(--n);margin:12px 0}.premium ul{margin:14px 0;padding-left:20px}.pay-status{min-height:24px;margin-top:14px;color:var(--m);font-size:.92rem}.profile{margin-top:30px;padding:26px;border-radius:20px;background:#fff;border:1px solid var(--b)}.profile h2{color:var(--n);margin:8px 0}.analysis{display:grid;gap:10px;margin-top:18px}.analysis div{padding:14px;border-radius:14px;background:var(--c)}.analysis strong{color:var(--n)}@media(max-width:650px){.topin{align-items:flex-start}.wrap{margin-top:18px}.nav{flex-direction:column}.nav .btn{width:100%}.grid{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="topin"><a href="/"><img src="/assets/innovators-world-logo.png" alt="Innovators World"></a><a class="back" href="/">← Back to Innovators World</a></div></header><main class="wrap"><section id="intro" class="panel intro"><div class="ey">Free discovery assessment</div><h1>Discover your Innovation DNA.</h1><p>IWDA is a starting point for understanding how you naturally observe, question, imagine, create, test and improve. There are no grades and no fixed personality labels.</p><div class="actions"><button id="start" class="btn primary">Start IWDA — Free</button></div><div id="startError" class="error hidden" role="alert"></div></section><section id="assessment" class="panel hidden" aria-live="polite"><div id="qnum" class="qnum"></div><div class="progress"><div id="bar"></div></div><div id="question" class="question"></div><div id="status" class="status" role="status"></div><div class="nav"><button id="prev" class="btn secondary">Previous</button><button id="next" class="btn primary">Next</button></div></section><section id="result" class="panel hidden"></section></main><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>const S={questions:[],options:{},index:0,answers:{},attemptId:null,resultId:null};const $=id=>document.getElementById(id);const show=(id,on)=>$(id).classList.toggle('hidden',!on);async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.error||`Request failed (${r.status})`);return d}function session(){let x=localStorage.getItem('iwda_session');if(!x){x=crypto.randomUUID();localStorage.setItem('iwda_session',x)}return x}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function start(){const b=$('start');b.disabled=true;b.textContent='Starting…';$('startError').classList.add('hidden');try{const [q,o]=await Promise.all([api('/api/iwda/questions'),fetch('/iwda-options.json',{cache:'no-store'}).then(async r=>{if(!r.ok)throw Error('IWDA answer choices are unavailable.');return r.json()})]);if(q.questions?.length!==24||Object.keys(o).length!==24)throw Error('IWDA question set is unavailable.');const s=await api('/api/iwda/start',{method:'POST',body:JSON.stringify({anonymous_session_id:session()})});S.questions=q.questions;S.options=o;S.attemptId=s.attempt_id;S.index=0;S.answers={};localStorage.setItem('iwda_attempt',S.attemptId);show('intro',false);show('assessment',true);render()}catch(e){$('startError').textContent=e.message;$('startError').classList.remove('hidden')}finally{b.disabled=false;b.textContent='Start IWDA — Free'}}function render(){const q=S.questions[S.index],opts=S.options[q.id]||{};$('qnum').textContent=`Question ${S.index+1} of ${S.questions.length}`;$('bar').style.width=`${(S.index+1)/S.questions.length*100}%`;$('question').innerHTML=`<h2>${esc(q.prompt)}</h2><div class="options">${['A','B','C','D'].map(a=>`<button class="option ${S.answers[q.id]===a?'selected':''}" data-answer="${a}" aria-pressed="${S.answers[q.id]===a}"><span class="letter">${a}</span><span>${esc(opts[a]||`Answer ${a}`)}</span></button>`).join('')}</div>`;$('question').querySelectorAll('.option').forEach(b=>b.onclick=()=>select(b.dataset.answer));$('prev').disabled=S.index===0;$('next').textContent=S.index===S.questions.length-1?'Complete IWDA':'Next';$('status').textContent=S.answers[q.id]?'Answer saved.':'Select one answer to continue.'}async function select(answer){const q=S.questions[S.index];S.answers[q.id]=answer;render();$('status').textContent='Saving…';try{await api('/api/iwda/answer',{method:'POST',body:JSON.stringify({attempt_id:S.attemptId,question_id:q.id,answer})});$('status').textContent='Answer saved.'}catch(e){delete S.answers[q.id];render();$('status').textContent=e.message}}async function next(){const q=S.questions[S.index];if(!S.answers[q.id]){$('status').textContent='Please select an answer before continuing.';return}if(S.index<S.questions.length-1){S.index++;render();return}$('next').disabled=true;$('prev').disabled=true;$('status').textContent='Calculating your result…';try{const d=await api('/api/iwda/complete',{method:'POST',body:JSON.stringify({attempt_id:S.attemptId})});S.resultId=d.result?.id||null;result(d.result);show('assessment',false);show('result',true);localStorage.removeItem('iwda_attempt')}catch(e){$('status').textContent=e.message;$('next').disabled=false;$('prev').disabled=false}}function result(r){const d=r.result_data||{},dims=Array.isArray(d.dimensions)?d.dimensions:[],labels={OBS:'Observe',QUE:'Question',IMA:'Imagine',CRE:'Create',TST:'Test',IMP:'Improve'},cards=dims.map(x=>`<div class="metric"><strong>${Number(x.score).toFixed(2)}</strong><small>${esc(labels[x.dimension||x.code]||x.name||x.dimension||x.code)}</small><div style="color:var(--m);font-size:.8rem">${x.raw_score??'—'}/${x.max_score??'—'}</div></div>`).join('');$('result').innerHTML=`<div class="ey">Your Innovation DNA</div><div class="resultHero"><div class="score">${Number(r.innovation_readiness_index).toFixed(2)}</div><div class="level">${esc(d.level||'Result')}</div></div><div class="grid">${cards}</div><div style="margin-top:24px"><strong>Primary strength:</strong> ${esc(labels[d.primary_strength]||d.primary_strength||'—')}<br><strong>Secondary strength:</strong> ${esc(labels[d.secondary_strength]||d.secondary_strength||'—')}<br><strong>Growth dimension:</strong> ${esc(labels[d.growth_dimension]||d.growth_dimension||'—')}</div><div style="margin-top:22px"><strong>Traits</strong><div class="traits">${(r.traits||[]).map(t=>`<span class="trait">${esc(t)}</span>`).join('')}</div></div><p class="note">This is a discovery and development instrument, not a diagnosis, intelligence test or academic grade. Use it as a starting point for your Innovators World journey.</p><section class="premium"><div class="ey">Go deeper</div><h2>Complete Innovation Profile</h2><p>Your free IWDA result shows where you are today. The Complete Innovation Profile provides a deeper analysis of your innovation dimensions, strengths, development opportunities and recommended next steps.</p><ul><li>Detailed analysis of all six innovation dimensions</li><li>Strengths and development opportunities</li><li>Personalized recommendations</li><li>Suggested Innovators World experiences</li></ul><div class="price">$19.95 USD</div><button id="payProfile" class="btn primary">Unlock My Complete Innovation Profile</button><div id="payStatus" class="pay-status" role="status"></div></section><div class="actions"><a class="btn secondary" href="/">Continue the Journey</a><button class="btn secondary" onclick="location.reload()">Take Again</button></div>`}function renderProfile(p){const d=p||{},dims=Array.isArray(d.dimensions)?d.dimensions:[],analysis=d.analysis&&typeof d.analysis==='object'?d.analysis:{},nexts=Array.isArray(d.recommended_next_steps)?d.recommended_next_steps:[];const cards=dims.map(x=>`<div class="metric"><strong>${Number(x.score).toFixed(2)}</strong><small>${esc(x.name||x.dimension||x.code||'Dimension')}</small><div style="color:var(--m);font-size:.8rem">${x.raw_score??'—'}/${x.max_score??'—'}</div></div>`).join('');const analysisHtml=Object.entries(analysis).map(([k,v])=>`<div><strong>${esc(k.charAt(0).toUpperCase()+k.slice(1))}</strong><br>${esc(v)}</div>`).join('');$('result').innerHTML=`<div class="ey">Your complete profile</div><div class="resultHero"><div class="score">${Number(d.innovation_readiness_index).toFixed(2)}</div><div class="level">${esc(d.level||'Innovation Profile')}</div></div><div class="profile"><h2>Complete Innovation Profile</h2><p>Your Innovation Readiness Index is <strong>${Number(d.innovation_readiness_index).toFixed(2)}</strong>. Your profile combines your strongest dimensions, development focus and practical next steps.</p><div style="margin-top:18px"><strong>Strengths:</strong> ${esc((d.strengths||[]).join(' · ')||'—')}<br><strong>Growth dimension:</strong> ${esc(d.growth_dimension||'—')}</div><div style="margin-top:18px"><strong>Traits</strong><div class="traits">${(d.traits||[]).map(t=>`<span class="trait">${esc(t)}</span>`).join('')}</div></div><div class="grid" style="margin-top:22px">${cards}</div><h3 style="color:var(--n);margin-top:28px">Dimension insights</h3><div class="analysis">${analysisHtml}</div><h3 style="color:var(--n);margin-top:28px">Development focus</h3><p>${esc(d.development_focus||'')}</p><h3 style="color:var(--n);margin-top:28px">Recommended next steps</h3><ol>${nexts.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="actions"><a class="btn primary" href="/">Continue the Journey</a><button class="btn secondary" onclick="location.reload()">Take Again</button></div>`}async function payProfile(){const b=$('payProfile'),status=$('payStatus');if(!S.attemptId||!S.resultId){status.textContent='Your IWDA result could not be linked to this purchase.';return}b.disabled=true;status.textContent='Preparing secure checkout…';try{const order=await api('/api/create-order',{method:'POST',body:JSON.stringify({attempt_id:S.attemptId,amount:1995,currency:'USD'})});const options={key:order.key_id,amount:order.amount,currency:order.currency,name:'Innovators World',description:'Complete Innovation Profile — $19.95',order_id:order.order_id,handler:async function(response){status.textContent='Verifying payment…';try{const verified=await api('/api/verify-payment',{method:'POST',body:JSON.stringify({attempt_id:S.attemptId,razorpay_payment_id:response.razorpay_payment_id,razorpay_order_id:response.razorpay_order_id,razorpay_signature:response.razorpay_signature})});if(!verified.verified)throw Error('Payment could not be verified.');if(verified.profile_ready&&verified.profile){renderProfile(verified.profile);return}throw Error('Payment verified, but your profile is not yet available.')}catch(e){status.textContent=e.message;b.disabled=false}},modal:{ondismiss:function(){status.textContent='Checkout cancelled. No payment was completed.';b.disabled=false}},theme:{color:'#d6aa4a'}};const rzp=new Razorpay(options);rzp.on('payment.failed',function(response){status.textContent=response.error?.description||'Payment failed. Please try again.';b.disabled=false});rzp.open()}catch(e){status.textContent=e.message;b.disabled=false}}$('start').onclick=start;$('next').onclick=next;$('prev').onclick=()=>{if(S.index>0){S.index--;render()}};document.addEventListener('click',e=>{if(e.target?.id==='payProfile')payProfile()});</script></body></html>
