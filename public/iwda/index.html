<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b3a"><title>IWDA — Innovators World</title><link rel="icon" href="/assets/innovators-world-symbol.png">
<style>
:root{--n:#071b3a;--n2:#0d2a55;--g:#d6aa4a;--gl:#f0d58a;--c:#f7f5ef;--t:#172033;--m:#667085;--b:rgba(7,27,58,.12);--s:0 20px 60px rgba(7,27,58,.12)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--t);background:var(--c);line-height:1.6}.top{background:var(--n);padding:14px 20px}.topin,.wrap{width:min(900px,calc(100% - 28px));margin:auto}.topin{display:flex;justify-content:space-between;align-items:center;gap:16px}.top img{width:135px;background:#fff;padding:6px;border-radius:6px}.back{color:#fff;font-weight:750}.panel{background:#fff;border:1px solid var(--b);border-radius:24px;box-shadow:var(--s);padding:clamp(22px,5vw,48px)}.wrap{margin-top:34px;margin-bottom:70px}.ey{color:var(--g);font-size:.78rem;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.intro h1{color:var(--n);font-size:clamp(2.5rem,7vw,4.6rem);line-height:1.05;margin:12px 0 18px}.intro p{max-width:680px;color:var(--m);font-size:1.08rem}.btn{min-height:50px;padding:0 24px;border-radius:999px;font:inherit;font-weight:850;cursor:pointer;border:1px solid var(--b)}.primary{background:var(--g);color:var(--n);border-color:var(--g)}.secondary{background:#fff;color:var(--n)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.hidden{display:none!important}.progress{height:9px;background:#e8eaee;border-radius:99px;overflow:hidden;margin:12px 0 30px}.progress div{height:100%;background:var(--g);transition:width .2s}.qnum{color:var(--g);font-weight:850;font-size:.84rem;letter-spacing:.08em;text-transform:uppercase}.question h2{color:var(--n);font-size:clamp(1.55rem,4vw,2.25rem);line-height:1.25;margin:12px 0 26px}.options{display:grid;gap:12px}.option{width:100%;display:flex;align-items:flex-start;gap:14px;text-align:left;padding:17px;background:#fff;border:1px solid var(--b);border-radius:16px;font:inherit;cursor:pointer}.option:hover,.option:focus-visible{border-color:var(--g);outline:3px solid rgba(214,170,74,.18)}.option.selected{background:#fff9e9;border-color:var(--g);box-shadow:inset 0 0 0 1px var(--g)}.letter{min-width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--c);color:var(--n);font-weight:900}.selected .letter{background:var(--g)}.status{min-height:28px;margin:20px 0;color:var(--m);font-size:.92rem}.nav{display:flex;justify-content:space-between;gap:12px}.error{padding:16px;border-radius:14px;background:#fff0f0;color:#8a1c1c;border:1px solid #efb4b4;margin-top:18px}.resultHero{background:linear-gradient(135deg,var(--n),var(--n2));color:#fff;border-radius:20px;padding:30px;margin:20px 0}.score{font-size:clamp(3.4rem,10vw,5.6rem);line-height:1;font-weight:900;color:var(--gl)}.level{font-size:1.2rem;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:18px;border:1px solid var(--b);border-radius:16px}.metric strong{display:block;font-size:1.5rem;color:var(--n)}.metric small{color:var(--m)}.traits{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}.trait{padding:8px 12px;border-radius:999px;background:var(--c);font-weight:750}.note{color:var(--m);font-size:.94rem;margin-top:24px}@media(max-width:650px){.topin{align-items:flex-start}.wrap{margin-top:18px}.nav{flex-direction:column}.nav .btn{width:100%}.grid{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<header class="top"><div class="topin"><a href="/"><img src="/assets/innovators-world-logo.png" alt="Innovators World"></a><a class="back" href="/">← Back to Innovators World</a></div></header>
<main class="wrap">
<section id="intro" class="panel intro"><div class="ey">Free discovery assessment</div><h1>Discover your Innovation DNA.</h1><p>IWDA is a starting point for understanding how you naturally observe, question, imagine, create, test and improve. There are no grades and no fixed personality labels.</p><div class="actions"><button id="start" class="btn primary">Start IWDA — Free</button></div><div id="startError" class="error hidden" role="alert"></div></section>
<section id="assessment" class="panel hidden" aria-live="polite"><div id="qnum" class="qnum"></div><div class="progress"><div id="bar"></div></div><div id="question" class="question"></div><div id="status" class="status" role="status"></div><div class="nav"><button id="prev" class="btn secondary">Previous</button><button id="next" class="btn primary">Next</button></div></section>
<section id="result" class="panel hidden"></section>
</main>
<script>
const S={questions:[],options:{},index:0,answers:{},attemptId:null};const $=id=>document.getElementById(id);const show=(id,on)=>$(id).classList.toggle('hidden',!on);
async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.error||`Request failed (${r.status})`);return d}
function session(){let x=localStorage.getItem('iwda_session');if(!x){x=crypto.randomUUID();localStorage.setItem('iwda_session',x)}return x}
async function start(){const b=$('start');b.disabled=true;b.textContent='Starting…';$('startError').classList.add('hidden');try{const [q,o]=await Promise.all([api('/api/iwda/questions'),fetch('/iwda-options.json',{cache:'no-store'}).then(async r=>{if(!r.ok)throw Error('IWDA answer choices are unavailable.');return r.json()})]);if(q.questions?.length!==24)throw Error('IWDA question set is unavailable.');if(Object.keys(o).length!==24)throw Error('IWDA answer choices are incomplete.');const s=await api('/api/iwda/start',{method:'POST',body:JSON.stringify({anonymous_session_id:session()})});S.questions=q.questions;S.options=o;S.attemptId=s.attempt_id;S.index=0;S.answers={};localStorage.setItem('iwda_attempt',S.attemptId);show('intro',false);show('assessment',true);render()}catch(e){$('startError').textContent=e.message;$('startError').classList.remove('hidden')}finally{b.disabled=false;b.textContent='Start IWDA — Free'}}
function render(){const q=S.questions[S.index];const opts=S.options[q.id]||{};$('qnum').textContent=`Question ${S.index+1} of ${S.questions.length}`;$('bar').style.width=`${(S.index+1)/S.questions.length*100}%`;$('question').innerHTML=`<h2>${esc(q.prompt)}</h2><div class="options">${['A','B','C','D'].map(a=>`<button class="option ${S.answers[q.id]===a?'selected':''}" data-answer="${a}" aria-pressed="${S.answers[q.id]===a}"><span class="letter">${a}</span><span>${esc(opts[a]||`Answer ${a}`)}</span></button>`).join('')}</div>`;$('question').querySelectorAll('.option').forEach(b=>b.onclick=()=>select(b.dataset.answer));$('prev').disabled=S.index===0;$('next').textContent=S.index===S.questions.length-1?'Complete IWDA':'Next';$('status').textContent=S.answers[q.id]?'Answer saved.':'Select one answer to continue.'}
async function select(answer){const q=S.questions[S.index];S.answers[q.id]=answer;render();$('status').textContent='Saving…';try{await api('/api/iwda/answer',{method:'POST',body:JSON.stringify({attempt_id:S.attemptId,question_id:q.id,answer})});$('status').textContent='Answer saved.'}catch(e){delete S.answers[q.id];render();$('status').textContent=e.message}}
async function next(){const q=S.questions[S.index];if(!S.answers[q.id]){$('status').textContent='Please select an answer before continuing.';return}if(S.index<S.questions.length-1){S.index++;render();return}$('next').disabled=true;$('prev').disabled=true;$('status').textContent='Calculating your result…';try{const d=await api('/api/iwda/complete',{method:'POST',body:JSON.stringify({attempt_id:S.attemptId})});result(d.result);show('assessment',false);show('result',true);localStorage.removeItem('iwda_attempt')}catch(e){$('status').textContent=e.message;$('next').disabled=false;$('prev').disabled=false}}
function result(r){const d=r.result_data||{},dims=Array.isArray(d.dimension_scores)?d.dimension_scores:[],labels={OBS:'Observe',QUE:'Question',IMA:'Imagine',CRE:'Create',TST:'Test',IMP:'Improve'};const cards=dims.map(x=>`<div class="metric"><strong>${Number(x.score).toFixed(2)}</strong><small>${esc(labels[x.dimension]||x.dimension)}</small><div style="color:var(--m);font-size:.8rem">${x.raw_score}/${x.max_score}</div></div>`).join('');$('result').innerHTML=`<div class="ey">Your Innovation DNA</div><div class="resultHero"><div class="score">${Number(r.innovation_readiness_index).toFixed(2)}</div><div class="level">${esc(d.level||'Result')}</div></div><div class="grid">${cards}</div><div style="margin-top:24px"><strong>Primary strength:</strong> ${esc(labels[d.primary_strength]||d.primary_strength||'—')}<br><strong>Secondary strength:</strong> ${esc(labels[d.secondary_strength]||d.secondary_strength||'—')}<br><strong>Growth dimension:</strong> ${esc(labels[d.growth_dimension]||d.growth_dimension||'—')}</div><div style="margin-top:22px"><strong>Traits</strong><div class="traits">${(r.traits||[]).map(t=>`<span class="trait">${esc(t)}</span>`).join('')}</div></div><p class="note">This is a discovery and development instrument, not a diagnosis, intelligence test or academic grade. Use it as a starting point for your Innovators World journey.</p><div class="actions"><a class="btn primary" href="/">Continue the Journey</a><button class="btn secondary" onclick="location.reload()">Take Again</button></div>`}
function esc(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('start').onclick=start;$('next').onclick=next;$('prev').onclick=()=>{if(S.index>0){S.index--;render()}};
</script></body></html>
