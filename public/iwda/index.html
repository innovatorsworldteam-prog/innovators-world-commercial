<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b3a">
  <title>IWDA — Innovators World</title>
  <link rel="icon" href="/assets/innovators-world-symbol.png">
  <style>
    :root{--navy:#071b3a;--navy2:#0d2a55;--gold:#d6aa4a;--gold2:#f0d58a;--cream:#f7f5ef;--text:#172033;--muted:#667085;--border:rgba(7,27,58,.12);--shadow:0 20px 60px rgba(7,27,58,.12);--radius:24px;--max:900px}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--cream);line-height:1.6}.top{background:var(--navy);color:#fff;padding:16px 20px}.top-inner{width:min(var(--max),100%);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}.top img{width:135px;background:#fff;padding:6px;border-radius:6px}.back{color:#fff;font-weight:700}.wrap{width:min(var(--max),calc(100% - 28px));margin:38px auto 70px}.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(24px,5vw,48px)}.eyebrow{color:var(--gold);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.intro h1{font-size:clamp(2.4rem,6vw,4.5rem);line-height:1.05;margin:12px 0 18px;color:var(--navy)}.intro p{max-width:680px;color:var(--muted);font-size:1.08rem}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border:0;border-radius:999px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:var(--navy)}.secondary{background:var(--cream);color:var(--navy);border:1px solid var(--border)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.status{margin:22px 0;color:var(--muted);font-size:.92rem}.progress{height:9px;background:#e9ebef;border-radius:99px;overflow:hidden;margin:12px 0 30px}.progress>div{height:100%;background:var(--gold);width:0;transition:width .2s}.question-number{font-weight:800;color:var(--gold);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}.question h2{font-size:clamp(1.55rem,4vw,2.2rem);line-height:1.25;color:var(--navy);margin:12px 0 26px}.options{display:grid;gap:12px}.option{display:flex;align-items:flex-start;gap:14px;width:100%;padding:18px;text-align:left;background:#fff;border:1px solid var(--border);border-radius:16px;color:var(--text);font:inherit;cursor:pointer}.option:hover,.option:focus-visible{border-color:var(--gold);outline:3px solid rgba(214,170,74,.18)}.option.selected{border-color:var(--gold);background:#fff9e9;box-shadow:inset 0 0 0 1px var(--gold)}.letter{min-width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--cream);font-weight:850;color:var(--navy)}.selected .letter{background:var(--gold)}.nav-actions{display:flex;justify-content:space-between;gap:12px;margin-top:30px}.hidden{display:none!important}.loading{text-align:center;padding:30px;color:var(--muted)}.error{padding:18px;border-radius:16px;background:#fff0f0;color:#8a1c1c;border:1px solid #efb4b4}.result-hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:20px;padding:30px;margin-bottom:24px}.score{font-size:clamp(3.2rem,10vw,5.5rem);font-weight:900;line-height:1;color:var(--gold2)}.level{font-size:1.2rem;font-weight:800;margin-top:8px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:18px;border:1px solid var(--border);border-radius:16px}.metric strong{display:block;font-size:1.5rem;color:var(--navy)}.metric small{color:var(--muted)}.traits{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.trait{padding:9px 13px;border-radius:999px;background:var(--cream);font-weight:750}.note{margin-top:24px;color:var(--muted);font-size:.94rem}@media(max-width:650px){.top-inner{align-items:flex-start}.wrap{margin-top:20px}.panel{padding:22px 18px}.nav-actions{flex-direction:column}.nav-actions .btn{width:100%}.result-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<header class="top"><div class="top-inner"><a href="/"><img src="/assets/innovators-world-logo.png" alt="Innovators World"></a><a class="back" href="/">← Back to Innovators World</a></div></header>
<main class="wrap">
  <section id="intro" class="panel intro"><div class="eyebrow">Free discovery assessment</div><h1>Discover your Innovation DNA.</h1><p>IWDA is a starting point for understanding how you naturally observe, question, imagine, create, test and improve. There are no grades and no fixed personality labels.</p><div class="actions"><button id="start" class="btn primary" type="button">Start IWDA — Free</button></div><div id="start-error" class="error hidden" role="alert"></div></section>
  <section id="assessment" class="panel hidden" aria-live="polite"><div class="question-number" id="progress-label">Question 1 of 24</div><div class="progress" aria-hidden="true"><div id="progress-bar"></div></div><div id="question" class="question"></div><div id="save-status" class="status" role="status"></div><div class="nav-actions"><button id="prev" class="btn secondary" type="button">Previous</button><button id="next" class="btn primary" type="button">Next</button></div></section>
  <section id="result" class="panel hidden"></section>
</main>
<script>
const state={questions:[],index:0,answers:{},attemptId:null};
const $=id=>document.getElementById(id);
const show=(id,visible)=>$(id).classList.toggle('hidden',!visible);
async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let data=null;try{data=await r.json()}catch{}if(!r.ok)throw new Error(data?.error||`Request failed (${r.status})`);return data}
function sessionId(){let id=localStorage.getItem('iwda_anonymous_session_id');if(!id){id=crypto.randomUUID();localStorage.setItem('iwda_anonymous_session_id',id)}return id}
async function start(){ $('start').disabled=true;$('start').textContent='Starting…';$('start-error').classList.add('hidden');try{const q=await api('/api/iwda/questions');if(!Array.isArray(q.questions)||q.questions.length!==24)throw new Error('IWDA question set is unavailable.');const s=await api('/api/iwda/start',{method:'POST',body:JSON.stringify({anonymous_session_id:sessionId()})});state.questions=q.questions;state.attemptId=s.attempt_id;state.index=0;state.answers={};localStorage.setItem('iwda_attempt_id',state.attemptId);show('intro',false);show('assessment',true);render()}catch(e){$('start-error').textContent=e.message;$('start-error').classList.remove('hidden')}finally{$('start').disabled=false;$('start').textContent='Start IWDA — Free'}}
function render(){const q=state.questions[state.index];$('progress-label').textContent=`Question ${state.index+1} of ${state.questions.length}`;$('progress-bar').style.width=`${((state.index+1)/state.questions.length)*100}%`;$('question').innerHTML='';const h=document.createElement('h2');h.textContent=q.prompt;$('question').appendChild(h);const opts=document.createElement('div');opts.className='options';for(const letter of ['A','B','C','D']){const b=document.createElement('button');b.type='button';b.className='option'+(state.answers[q.id]===letter?' selected':'');b.innerHTML=`<span class="letter">${letter}</span><span>Option ${letter}</span>`;b.setAttribute('aria-pressed',state.answers[q.id]===letter?'true':'false');b.addEventListener('click',()=>select(letter));opts.appendChild(b)}$('question').appendChild(opts);$('prev').disabled=state.index===0;$('next').textContent=state.index===state.questions.length-1?'Complete IWDA':'Next';$('save-status').textContent=state.answers[q.id]?'Answer saved.':'Select one answer to continue.'}
async function select(letter){const q=state.questions[state.index];state.answers[q.id]=letter;render();$('save-status').textContent='Saving…';try{await api('/api/iwda/answer',{method:'POST',body:JSON.stringify({attempt_id:state.attemptId,question_id:q.id,answer:letter})});$('save-status').textContent='Answer saved.'}catch(e){delete state.answers[q.id];render();$('save-status').textContent=e.message}}
function next(){const q=state.questions[state.index];if(!state.answers[q.id]){$('save-status').textContent='Please select an answer before continuing.';return}if(state.index<state.questions.length-1){state.index++;render();return}complete()}
async function complete(){$('next').disabled=true;$('prev').disabled=true;$('save-status').textContent='Calculating your result…';try{const data=await api('/api/iwda/complete',{method:'POST',body:JSON.stringify({attempt_id:state.attemptId})});renderResult(data.result);show('assessment',false);show('result',true);localStorage.removeItem('iwda_attempt_id')}catch(e){$('save-status').textContent=e.message;$('prev').disabled=false;$('next').disabled=false}}
function renderResult(r){const d=r?.result_data||{};const dims=d.dimension_scores||{};const labels={OBS:'Observe',QUE:'Question',IMA:'Imagine',CRE:'Create',TST:'Test',IMP:'Improve'};let cards=Object.entries(dims).map(([k,v])=>{const score=typeof v==='object'?(v.normalized_score??v.score??v.percentage??0):v;return `<div class="metric"><strong>${typeof score==='number'?score.toFixed(2):score}</strong><small>${labels[k]||k}</small></div>`}).join('');$('result').innerHTML=`<div class="eyebrow">Your Innovation DNA</div><div class="result-hero"><div class="score">${Number(r.innovation_readiness_index).toFixed(2)}</div><div class="level">${d.level||'Result'}</div></div><div class="result-grid">${cards}</div><div style="margin-top:24px"><strong>Primary strength:</strong> ${labels[d.primary_strength]||d.primary_strength||'—'}<br><strong>Secondary strength:</strong> ${labels[d.secondary_strength]||d.secondary_strength||'—'}<br><strong>Growth dimension:</strong> ${labels[d.growth_dimension]||d.growth_dimension||'—'}</div><div style="margin-top:22px"><strong>Traits</strong><div class="traits">${(r.traits||[]).map(t=>`<span class="trait">${escapeHtml(t)}</span>`).join('')}</div></div><p class="note">This is a discovery and development instrument, not a diagnosis, intelligence test or academic grade. Use the result as a starting point for your Innovators World journey.</p><div class="actions"><a class="btn primary" href="/">Continue the Journey</a><button class="btn secondary" type="button" onclick="location.reload()">Take Again</button></div>`}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('start').addEventListener('click',start);$('prev').addEventListener('click',()=>{if(state.index>0){state.index--;render()}});$('next').addEventListener('click',next);
</script>
</body>
</html>
